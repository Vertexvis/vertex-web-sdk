<!doctype html>
<html lang="en" xml:lang="en">
  <head>
    <title>Metadata Operations</title>

    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script type="module" src="main.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@vertexvis/viewer@0.24.x/dist/viewer/viewer.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@vertexvis/viewer@0.24.x/dist/viewer/viewer.esm.js"
    ></script>
  </head>
  <body>
    <div class="app">
      <vertex-viewer id="viewer" class="viewer">
      </vertex-viewer>
      <div class="inputs">
        <label class="invisible" for="metadata-key">Metadata Key</label>
        <input id="metadata-key" type="text" placeholder="Metadata Key" />
        <label class="invisible" for="metadata-value">Metadata Value</label>
        <input id="metadata-value" type="text" placeholder="Metadata Value" />
        <button id="search-btn">Search</button>
        <button id="clear-btn">Clear</button>
    </div>
  </body>
</html>
